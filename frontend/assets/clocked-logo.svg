<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clock outer ring -->
  <circle cx="100" cy="100" r="78" stroke="url(#clockGrad)" stroke-width="10" fill="none" stroke-linecap="round" />
  <circle cx="100" cy="100" r="78" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.15" />

  <!-- Hour markers -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <line x1="100" y1="26" x2="100" y2="36" />
    <line x1="100" y1="164" x2="100" y2="174" />
    <line x1="26" y1="100" x2="36" y2="100" />
    <line x1="164" y1="100" x2="174" y2="100" />
    <line x1="58.6" y1="58.6" x2="66.2" y2="66.2" />
    <line x1="133.8" y1="133.8" x2="141.4" y2="141.4" />
    <line x1="58.6" y1="141.4" x2="66.2" y2="133.8" />
    <line x1="133.8" y1="58.6" x2="141.4" y2="66.2" />
    <line x1="78.6" y1="30.8" x2="84.2" y2="34.6" />
    <line x1="115.8" y1="165.4" x2="121.4" y2="161.4" />
    <line x1="30.8" y1="121.4" x2="34.6" y2="115.8" />
    <line x1="165.4" y1="78.6" x2="161.4" y2="84.2" />
  </g>

  <!-- Ticket body (clock minute hand extended into a support ticket) -->
  <path d="M 100 100 L 132 42 L 158 42 L 158 98 L 132 98 Z" fill="#ffffff" opacity="0.9" />
  <path d="M 100 100 L 132 42" stroke="#6366f1" stroke-width="7" stroke-linecap="round" fill="none" />

  <!-- Ticket perforation dots (left edge of ticket) -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="133" cy="50" r="1.8" />
    <circle cx="133" cy="60" r="1.8" />
    <circle cx="133" cy="70" r="1.8" />
    <circle cx="133" cy="80" r="1.8" />
    <circle cx="133" cy="90" r="1.8" />
  </g>

  <!-- Intelligence spark at center -->
  <circle cx="100" cy="100" r="6" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="100" cy="100" r="10" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Clock hour hand (short, pointing to ~2 o'clock) -->
  <line x1="100" y1="100" x2="122" y2="72" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />
</svg>